name: Build and Upload Wheels

on:
  push:
    branches: [ "main" ]  # Now it runs on every push
  workflow_dispatch:      # This adds a "Run workflow" button to the UI

jobs:
  build_wheels:
    name: Build wheels on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - uses: actions/checkout@v4

      - name: Build wheels
        uses: pypa/cibuildwheel@v2.22.0
        env:
          # Optional: Skip older versions or 32-bit builds to save time
          CIBW_SKIP: "cp36-* cp37-* cp38-* *-win32 *-manylinux_i686"

      - uses: actions/upload-artifact@v4
        with:
          name: cibw-wheels-${{ matrix.os }}-${{ strategy.job-index }}
          path: ./wheelhouse/*.whl

  upload_pypi:
    needs: [build_wheels]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: cibw-wheels-*
          path: dist
          merge-multiple: true

      - name: Publish to TestPyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
          # You will need to set up "Trusted Publishing" on TestPyPI
          # or use a password/token secret.
          password: ${{ secrets.TEST_PYPI_API_TOKEN }}